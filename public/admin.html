<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="background.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="background-animation">
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="laundry-item shirt"></div>
    <div class="laundry-item sock"></div>
    <div class="laundry-item washer"></div>
    <div class="laundry-item shirt"></div>
    <div class="laundry-item sock"></div>
  </div>

  <div class="login-center">
    <div class="login-box">
      <h2>Admin Login</h2>
      <input id="email" type="email" placeholder="Email Address" required>
      <input id="password" type="password" placeholder="Password" required>
      <div class="button-group">
        <button onclick="login()" class="primary-button">Login</button>
        <button onclick="location.href='/signup.html'" class="secondary-button">Sign Up</button>
      </div>
    </div>
  </div>

  <div id="dashboard" style="display:none;">
    <header class="dashboard-header">
      <h1>Admin Dashboard</h1>
      <div class="admin-info">
        <span id="adminName">Welcome</span>
        <button onclick="logout()" class="logout-btn">Logout</button>
      </div>
    </header>

    <div class="dashboard-container">
      <div class="dashboard-grid">
        <!-- New Entry Form Section -->
        <section class="new-entry-section">
          <div class="section-header">
            <h2>New Laundry Entry</h2>
          </div>
          <div class="new-entry-form">
            <div id="tokenDisplay" class="token-display">
              <span id="tokenText">No token generated yet</span>
              <button onclick="generateToken()" class="generate-token-btn">Generate New Token</button>
            </div>
            
            <div class="form-group">
              <label>Type of Wash:</label>
              <select id="washType" class="form-control">
                <option value="Regular Wash">Regular Wash</option>
                <option value="Dry Clean">Dry Clean</option>
                <option value="Express Wash">Express Wash</option>
                <option value="Delicate Wash">Delicate Wash</option>
              </select>
            </div>

            <div class="form-group">
              <label>Items and Quantities:</label>
              <div class="items-grid" id="itemTypes">
                <div class="item-row">
                  <div class="item-info">
                    <input type="checkbox" id="shirts" value="Shirts">
                    <label for="shirts">Shirts</label>
                    <div class="item-quantity">
                      <button type="button" onclick="decrementQuantity('shirtsQty')" class="qty-btn">−</button>
                      <input type="number" id="shirtsQty" value="0" min="0" max="99" class="qty-input" onchange="validateQuantity(this)">
                      <button type="button" onclick="incrementQuantity('shirtsQty')" class="qty-btn">+</button>
                    </div>
                  </div>
                </div>

                <div class="item-row">
                  <div class="item-info">
                    <input type="checkbox" id="pants" value="Pants">
                    <label for="pants">Pants</label>
                    <div class="item-quantity">
                      <button type="button" onclick="decrementQuantity('pantsQty')" class="qty-btn">−</button>
                      <input type="number" id="pantsQty" value="0" min="0" max="99" class="qty-input" onchange="validateQuantity(this)">
                      <button type="button" onclick="incrementQuantity('pantsQty')" class="qty-btn">+</button>
                    </div>
                  </div>
                </div>

                <div class="item-row">
                  <div class="item-info">
                    <input type="checkbox" id="skirts" value="Skirts">
                    <label for="skirts">Skirts</label>
                    <div class="item-quantity">
                      <button type="button" onclick="decrementQuantity('skirtsQty')" class="qty-btn">−</button>
                      <input type="number" id="skirtsQty" value="0" min="0" max="99" class="qty-input" onchange="validateQuantity(this)">
                      <button type="button" onclick="incrementQuantity('skirtsQty')" class="qty-btn">+</button>
                    </div>
                  </div>
                </div>

                <div class="item-row">
                  <div class="item-info">
                    <input type="checkbox" id="hoodies" value="Hoodies">
                    <label for="hoodies">Hoodies</label>
                    <div class="item-quantity">
                      <button type="button" onclick="decrementQuantity('hoodiesQty')" class="qty-btn">−</button>
                      <input type="number" id="hoodiesQty" value="0" min="0" max="99" class="qty-input" onchange="validateQuantity(this)">
                      <button type="button" onclick="incrementQuantity('hoodiesQty')" class="qty-btn">+</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="form-group notes-group">
              <label>Notes:</label>
              <textarea id="notes" rows="3" class="form-control" placeholder="Add any special instructions or notes"></textarea>
            </div>

            <div class="form-actions">
              <button onclick="createEntry()" class="primary-button create-entry-btn">Create Entry</button>
            </div>
          </div>
        </section>

        <!-- Entries List Section -->
        <section class="entries-section">
          <div class="section-header">
            <h2>All Entries</h2>
            <div class="entries-actions">
              <input type="text" id="searchEntries" class="search-input" placeholder="Search entries..." oninput="loadEntries()">
              <select id="filterStatus" class="filter-select" onchange="loadEntries()">
                <option value="">All Status</option>
                <option value="Pending">Pending</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
              </select>
            </div>
          </div>
          <div class="entries-list" id="entries">
            <!-- Entries will be loaded here -->
          </div>
        </section>
      </div>
    </div>
  </div>

  <script>
    let token = '';

    // Function to generate a random token
    async function generateToken() {
      const token = Math.random().toString(36).substring(2, 10).toUpperCase();
      document.getElementById('tokenText').textContent = `Token: ${token}`;
      return token;
    }

    // Logout function
    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('adminName');
      document.getElementById('dashboard').style.display = 'none';
      document.querySelector('.login-center').style.display = 'block';
      token = '';
    }

    // Functions for quantity management
    function incrementQuantity(id) {
      const input = document.getElementById(id);
      const currentValue = parseInt(input.value);
      if (currentValue < 99) {
        input.value = currentValue + 1;
        const checkboxId = id.replace('Qty', '');
        document.getElementById(checkboxId).checked = true;
      }
    }

    function decrementQuantity(id) {
      const input = document.getElementById(id);
      const currentValue = parseInt(input.value);
      if (currentValue > 0) {
        input.value = currentValue - 1;
        if (currentValue === 1) {
          const checkboxId = id.replace('Qty', '');
          document.getElementById(checkboxId).checked = false;
        }
      }
    }

    function validateQuantity(input) {
      let value = parseInt(input.value);
      if (isNaN(value) || value < 0) value = 0;
      if (value > 99) value = 99;
      input.value = value;
      
      const checkboxId = input.id.replace('Qty', '');
      document.getElementById(checkboxId).checked = value > 0;
    }

    async function createEntry() {
      try {
        const tokenText = document.getElementById('tokenText').textContent;
        const token = tokenText.includes(':') ? tokenText.split(':')[1].trim() : null;
        
        if (!token || token === 'No token generated yet') {
          alert('Please generate a token first');
          return;
        }

        const washType = document.getElementById('washType').value;
        const items = [];
        
        ['shirts', 'pants', 'skirts', 'hoodies'].forEach(item => {
          const qty = parseInt(document.getElementById(item + 'Qty').value);
          if (qty > 0) {
            items.push({
              type: item.charAt(0).toUpperCase() + item.slice(1),
              quantity: qty
            });
          }
        });

        if (items.length === 0) {
          alert('Please select at least one item');
          return;
        }

        const notes = document.getElementById('notes').value;
        const storedToken = localStorage.getItem('token');
        
        if (!storedToken) {
          alert('Please login again, your session has expired');
          window.location.reload();
          return;
        }

        console.log('Sending request with data:', { token, washType, items, notes });
        
        const response = await fetch('/api/laundry/create', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${storedToken}`
          },
          body: JSON.stringify({
            token,
            washType,
            items,
            notes
          })
        });

        if (!response.ok) {
          const errorText = await response.text();
          try {
            const errorJson = JSON.parse(errorText);
            throw new Error(errorJson.message || 'Failed to create entry');
          } catch (e) {
            console.error('Raw error response:', errorText);
            throw new Error('Server error: Please try again');
          }
        }

        const data = await response.json();
        alert('Entry created successfully!');
        
        // Reset form
        document.getElementById('tokenText').textContent = 'No token generated yet';
        document.getElementById('washType').value = 'Regular Wash';
        document.getElementById('notes').value = '';
        ['shirts', 'pants', 'skirts', 'hoodies'].forEach(item => {
          document.getElementById(item + 'Qty').value = '0';
          document.getElementById(item).checked = false;
        });
        
        // Refresh entries list
        await loadEntries();
        
      } catch (error) {
        console.error('Error creating entry:', error);
        alert(error.message || 'Error creating entry. Please try again.');
      }
    }

    async function login() {
      try {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if (!email || !password) {
          alert('Please enter both email and password');
          return;
        }

        console.log('Attempting login...');
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();
        
        if (response.ok) {
          console.log('Login successful');
          token = data.token;
          localStorage.setItem('token', token);
          localStorage.setItem('adminName', data.name);
          document.getElementById('dashboard').style.display = 'block';
          document.querySelector('.login-center').style.display = 'none';
          loadEntries();
        } else {
          console.error('Login failed:', data);
          alert(data.message || 'Invalid credentials');
        }
      } catch (error) {
        console.error('Login error:', error);
        alert('Error during login. Please try again.');
      }
    }

    function toggleEntryDetails(entryId) {
      const details = document.getElementById(`details-${entryId}`);
      const btn = document.getElementById(`toggle-${entryId}`);
      details.classList.toggle('expanded');
      btn.classList.toggle('expanded');
    }

    // Setup search functionality
    document.addEventListener('DOMContentLoaded', () => {
      const searchInput = document.getElementById('searchEntries');
      if (searchInput) {
        searchInput.addEventListener('input', () => {
          loadEntries();
        });
      }
    });
    
    async function loadEntries() {
      const res = await fetch('/api/laundry/entries', {
        headers: { Authorization: `Bearer ${token}` }
      });
      let entries = await res.json();
      
      // Apply filter by status
      const filterStatus = document.getElementById('filterStatus').value;
      if (filterStatus) {
        entries = entries.filter(entry => entry.status === filterStatus);
      }

      // Apply search filter
      const searchTerm = document.getElementById('searchEntries').value.toLowerCase();
      if (searchTerm) {
        entries = entries.filter(entry => 
          entry.token.toLowerCase().includes(searchTerm) ||
          entry.washType.toLowerCase().includes(searchTerm) ||
          entry.status.toLowerCase().includes(searchTerm) ||
          (entry.notes && entry.notes.toLowerCase().includes(searchTerm)) ||
          (entry.items && entry.items.some(item => item.type.toLowerCase().includes(searchTerm)))
        );
      }
      
      // Sort by creation date - newest first
      entries.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      
      const entriesDiv = document.getElementById('entries');
      entriesDiv.innerHTML = '';
      
      if (entries.length === 0) {
        entriesDiv.innerHTML = '<p style="text-align: center; color: #999;">No entries found</p>';
        return;
      }
      
      entries.forEach((entry, index) => {
        const itemsList = entry.items.map(item => `${item.quantity}x ${item.type}`).join(', ');
        const statusColor = entry.status === 'Pending' ? '#fff3cd' : entry.status === 'In Progress' ? '#cce5ff' : '#d4edda';
        const statusTextColor = entry.status === 'Pending' ? '#856404' : entry.status === 'In Progress' ? '#004085' : '#155724';
        const entryId = `entry-${index}`;
        
        const entryDiv = document.createElement('div');
        entryDiv.className = 'entry-item';
        const createdDate = new Date(entry.createdAt).toLocaleDateString('en-US', {month: 'short', day: 'numeric'});
        const createdTime = new Date(entry.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        entryDiv.innerHTML = `
          <div class="entry-header" onclick="toggleEntryDetails('${entryId}')">
            <button class="entry-toggle-btn" id="toggle-${entryId}" onclick="event.stopPropagation();">▼</button>
            <div class="entry-token">${entry.token}</div>
            <span class="entry-status-badge" style="background: ${statusColor}; color: ${statusTextColor};">${entry.status}</span>
            <span style="font-size: 0.85rem; color: #999;">${entry.items.length} item(s)</span>
            <span style="font-size: 0.85rem; color: #666;">📅 ${createdDate} ${createdTime}</span>
          </div>
          <div class="entry-details" id="details-${entryId}">
            <p><strong>Wash Type:</strong> ${entry.washType}</p>
            <p><strong>Items:</strong> ${itemsList}</p>
            ${entry.notes ? `<p><strong>Notes:</strong> ${entry.notes}</p>` : ''}
            <div class="entry-actions">
              ${entry.status !== 'Completed' ? `<button class="primary-button" style="padding: 0.5rem 1rem; font-size: 0.85rem;" onclick="markCompleted('${entry.token}')">Mark Completed</button>` : '<span style="color: #28a745; font-weight: bold;">✓ Completed</span>'}
            </div>
          </div>
        `;
        entriesDiv.appendChild(entryDiv);
      });
    }
    
    async function markCompleted(token) {
      if (!confirm('Mark this entry as completed?')) return;
      try {
        const res = await fetch(`/api/laundry/complete/${token}`, {
          method: 'POST',
          headers: { Authorization: `Bearer ${localStorage.getItem('token')}` }
        });
        if (res.ok) {
          alert('Entry marked as completed');
          loadEntries();
        } else {
          alert('Error marking entry as completed');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Error marking entry as completed');
      }
    }
  </script>
</body>
</html>
